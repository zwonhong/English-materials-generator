<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini 구조화 JSON 디버그 | English Helper</title>
    <link rel="stylesheet" href="/css/gemini-test.css" />
    <script src="/js/gemini-test.js" defer></script>
  </head>
  <body>
    <main class="test-card">
      <p class="eyebrow">STEP 4-2 · DEVELOPMENT ONLY</p>
      <h1>Gemini 구조화 JSON 디버그</h1>
      <p class="description">
        이 페이지는 개발용입니다. 입력 한 건을 Gemini에 전송하고 responseSchema와 Zod 검증을 통과한 JSON을 표시합니다.
      </p>

      <form id="debugForm" class="debug-form">
        <label for="title">제목</label>
        <input id="title" name="title" type="text" value="Short Reading Test" required />

        <label for="englishOCR">영어 OCR</label>
        <textarea id="englishOCR" name="englishOCR" rows="8" required>The sun gives Earth light and heat. Plants use sunlight to make food. This process helps support life on Earth.</textarea>

        <label class="checkbox-label" for="hasTranslation">
          <input id="hasTranslation" name="hasTranslation" type="checkbox" />
          <span>기존 한국어 번역 있음</span>
        </label>

        <label for="koreanOCR">한국어 OCR</label>
        <textarea id="koreanOCR" name="koreanOCR" rows="6" disabled></textarea>

        <div class="actions">
          <button id="testButton" type="submit">구조화 JSON 생성</button>
          <a href="/">메인 화면으로 돌아가기</a>
        </div>
      </form>

      <p id="statusMessage" class="status" aria-live="polite"></p>
      <pre id="responseOutput" class="response-output" aria-label="Gemini 구조화 JSON 응답"></pre>
    </main>
  </body>
</html>

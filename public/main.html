<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Helper</title>
    <link rel="stylesheet" href="/css/main.css" />
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">PRIVATE WORKSPACE</p>
        <h1>English Helper</h1>
      </div>
      <form action="/logout" method="post">
        <button class="logout-button" type="submit">로그아웃</button>
      </form>
    </header>

    <main class="page-shell">
      <section class="intro" aria-labelledby="project-heading">
        <div>
          <p class="step-label">새 프로젝트</p>
          <h2 id="project-heading">OCR 원문 입력</h2>
          <p>
            교정할 영어 OCR 원문을 입력하고, 기존 한국어 번역이 있을 때만
            한국어 OCR을 함께 입력하세요.
          </p>
        </div>
        <button id="resetButton" class="secondary-button" type="button">
          New Project / Reset
        </button>
      </section>

      <section id="messageArea" class="message-area" aria-live="polite" hidden>
        <p id="messageText"></p>
      </section>

      <form id="projectForm" class="project-form">
        <div class="field-group compact-field">
          <label for="title">제목 <span aria-hidden="true">*</span></label>
          <p id="titleHelp" class="helper-text">
            PDF 제목과 다운로드 파일명에 사용할 프로젝트 제목입니다.
          </p>
          <input
            id="title"
            name="title"
            type="text"
            aria-describedby="titleHelp"
            autocomplete="off"
            required
          />
        </div>

        <div class="field-group">
          <label for="englishOcr">영어 OCR <span aria-hidden="true">*</span></label>
          <p id="englishHelp" class="helper-text">
            교정할 영어 OCR 원문을 그대로 붙여 넣으세요.
          </p>
          <textarea
            id="englishOcr"
            name="englishOcr"
            rows="16"
            aria-describedby="englishHelp"
            required
          ></textarea>
        </div>

        <div class="translation-option">
          <label class="checkbox-label" for="hasTranslation">
            <input id="hasTranslation" name="hasTranslation" type="checkbox" />
            <span>기존 한국어 번역 있음</span>
          </label>
          <p id="translationHelp" class="helper-text">
            한국어 OCR은 선택 사항입니다. 이미 번역된 한국어 원문이 있을 때만
            체크하고 입력하세요.
          </p>
        </div>

        <div class="field-group">
          <label for="koreanOcr">한국어 OCR</label>
          <textarea
            id="koreanOcr"
            name="koreanOcr"
            rows="12"
            aria-describedby="translationHelp"
            disabled
          ></textarea>
        </div>

        <div class="form-actions">
          <button id="generateButton" class="primary-button" type="submit">
            <span id="generateSpinner" class="button-spinner" aria-hidden="true"></span>
            <span id="generateButtonText">Generate</span>
          </button>
        </div>
      </form>

      <section id="resultSection" class="result-section" aria-labelledby="download-heading" hidden>
        <div class="result-header">
          <div>
            <p class="step-label">생성 결과</p>
            <h2 id="download-heading">다운로드</h2>
            <p id="resultSummary" class="helper-text">
              검증된 JSON이 브라우저 메모리에 준비되었습니다. 필요한 자료를 다운로드하세요.
            </p>
          </div>
        </div>

        <div class="download-actions" aria-label="다운로드 및 복사 버튼">
          <button id="studentSummaryButton" class="download-button" type="button" disabled>
            Student Summary PDF
          </button>
          <button id="teacherSummaryButton" class="download-button" type="button" disabled>
            Teacher Summary PDF
          </button>
          <button id="englishLineButton" class="download-button" type="button" disabled>
            English Line PDF
          </button>
          <button id="englishKoreanLineButton" class="download-button" type="button" disabled>
            English-Korean Line PDF
          </button>
          <button id="ocrLogButton" class="download-button" type="button" disabled>
            OCR Change Log
          </button>
          <button id="copyJsonButton" class="download-button utility-button" type="button" disabled>
            Copy JSON
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
